<!DOCTYPE html>
<html>
<head>
<title>Lalla HortiAgritech</title>
</head>
<body>
<h2>Lalla HortiAgritech</h2>
<p>Water Calculator</p>
<label>Surface (m²):</label>
<input id="s" type="number">
<br><br>
<label>Dose (L/m²):</label>
<input id="d" type="number">
<br><br>
<button onclick="calc()">Calculate</button>
<p id="result"></p>
<script>
function calc(){
let s=Number(document.getElementById("s").value);
let d=Number(document.getElementById("d").value);
let eau=s*d;
document.getElementById("result").innerHTML="Water Quantity: "+eau+" Litres";
}
</script>
</body>
</html>
